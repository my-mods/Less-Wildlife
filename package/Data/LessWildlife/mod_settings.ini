[Mod]
Id = Local_LessWildlife
Name = Less Wildlife
Version = 0.0.0
Author = oOCamilleOo
Description = Adjust boar and wolf populations and optionally replace roaming herds and packs with bandits.

[Setting.populationPercent]
Id = populationPercent
Label = Population
Group = Wildlife
Description = 10% to 200% of the original boar and wolf population. 100% is normal; 200% doubles it. Rounded with at least one animal for positive populations. Applies on later area encounters; already spawned animals are unaffected.
Type = percent
Minimum = 10
Maximum = 200
Step = 1
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = populationPercent

[Setting.reduceBoars]
Id = reduceBoars
Label = Adjust boars
Group = Wildlife
Description = On applies Population to ordinary boars. Off restores original values still controlled by this mod on later encounters. Already spawned animals are unaffected.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = reduceBoars

[Setting.reduceWolves]
Id = reduceWolves
Label = Adjust wolves
Group = Wildlife
Description = On applies Population to ordinary wolves. Off restores original values still controlled by this mod on later encounters. Already spawned animals are unaffected.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = reduceWolves

[Setting.boarReplacementChance]
Id = boarReplacementChance
Label = Boars to bandits
Group = Boars
Description = On replaces eligible newly generated boar herds with bandits, keeping the selected Population. Quest-controlled and scripted encounters are excluded. Existing encounters are unaffected. Default: Off.
Type = toggle
PresetValues = 0|100
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = boarReplacementChance

[Setting.wolfReplacementChance]
Id = wolfReplacementChance
Label = Wolves to bandits
Group = Wolves
Description = On replaces eligible newly generated wolf packs, including brown, white and astral variants, with bandits. Keeps the selected Population. Quest-controlled, summoned and scripted encounters are excluded. Existing encounters are unaffected. Default: Off.
Type = toggle
PresetValues = 0|100
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = wolfReplacementChance

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Group = Diagnostics
Description = Write aggregated population counts and timings to UE4SS.log. Leave Off for normal play.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = debugLogging
