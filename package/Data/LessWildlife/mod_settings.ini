[Mod]
Id = Local_LessWildlife
Name = Wilder Wildlife - Customize Enemy Spawns
Version = 1.0.0
Author = oOCamilleOo
Description = Adjust boar and wolf populations and randomly replace roaming herds and packs with selected enemies or no spawn.

[Setting.replaceBoars]
Id = replaceBoars
Label = Boars
Group = Wildlife
Description = Off: adjust the number of animals in each wildlife group. On: set a replacement chance using the shared Enemy type pool. Existing saved groups finish their current cycle unchanged.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = replaceBoars

[Setting.boarPopulationPercent]
Id = boarPopulationPercent
Label = Wildlife group size
Group = Wildlife
VisibleWhen = replaceBoars
VisibleValues = 0
Description = Boars per unchanged wildlife group, from 10% to 200% of the original size. 100% is normal. Changes affect later area encounters; existing animals are unaffected.
Type = percent
Minimum = 10
Maximum = 200
Step = 1
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = boarPopulationPercent

[Setting.boarReplacementChance]
Id = boarReplacementChance
Label = Replace boars
Group = Wildlife
VisibleWhen = replaceBoars
VisibleValues = 1
Description = Chance per eligible herd to use the shared Enemy type pool. 0% keeps wildlife; 100% replaces every eligible group. An empty pool keeps wildlife. Applies to newly selected groups and natural respawns.
Type = percent
Minimum = 0
Maximum = 100
Step = 1
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = boarReplacementChance

