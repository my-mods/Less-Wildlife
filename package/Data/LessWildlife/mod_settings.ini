[Mod]
Id = Local_LessWildlife
Name = Less Wildlife
Version = 0.0.0
Author = oOCamilleOo
Description = Set the population remaining in ordinary boar herds and wolf packs with one shared hook.

[Setting.populationPercent]
Id = populationPercent
Label = Population remaining
Group = Wildlife
Description = Percentage of the original boar and wolf population, rounded with at least one animal. Applies on later area encounters; already spawned animals are unaffected.
Type = percent
Minimum = 1
Maximum = 100
Step = 1
Decimals = 0
Default = 40
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = populationPercent

[Setting.reduceBoars]
Id = reduceBoars
Label = Reduce boars
Group = Wildlife
Description = On applies Population remaining to ordinary boars. Off restores original values still controlled by this mod on later encounters. Already spawned animals are unaffected.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = reduceBoars

[Setting.reduceWolves]
Id = reduceWolves
Label = Reduce wolves
Group = Wildlife
Description = On applies Population remaining to ordinary wolves. Off restores original values still controlled by this mod on later encounters. Already spawned animals are unaffected.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = reduceWolves

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Group = Diagnostics
Description = Write aggregated population counts and timings to UE4SS.log. Leave Off for normal play.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = debugLogging
