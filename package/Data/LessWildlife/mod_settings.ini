[Mod]
Id = Local_LessWildlife
Name = Less Wildlife
Version = 0.0.0
Author = oOCamilleOo
Description = Adjust boar and wolf populations and randomly replace roaming herds and packs with selected enemies or no spawn.

[Setting.populationPercent]
Id = populationPercent
Label = Population
Group = Wildlife
Description = 10% to 200% of the original boar and wolf population. 100% is normal; 200% doubles it. Rounded with at least one animal for positive populations. Applies on later area encounters; already spawned animals are unaffected.
Type = percent
Minimum = 10
Maximum = 200
Step = 1
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = populationPercent

[Setting.reduceBoars]
Id = reduceBoars
Label = Adjust boars
Group = Wildlife
Description = On applies Population to ordinary boars. Off restores original values still controlled by this mod on later encounters. Already spawned animals are unaffected.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = reduceBoars

[Setting.reduceWolves]
Id = reduceWolves
Label = Adjust wolves
Group = Wildlife
Description = On applies Population to ordinary wolves. Off restores original values still controlled by this mod on later encounters. Already spawned animals are unaffected.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = reduceWolves

[Setting.boarReplacementChance]
Id = boarReplacementChance
Label = Replacement chance
Group = Boars
Description = Chance per entire group, from 0% to 100%. Choose equally among enabled outcomes below. An empty pool keeps the animals. Quest-gated and scripted encounters are excluded. Changes apply to new groups and natural respawn cycles.
Type = percent
Minimum = 0
Maximum = 100
Step = 1
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = boarReplacementChance

[Setting.boarBandits]
Id = boarBandits
Label = Bandits
Group = Boars
Description = On adds bandits to this animal's random replacement pool. Off excludes this enemy type from future rolls.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = LessWildlife
ConfigKey = boarBandits

